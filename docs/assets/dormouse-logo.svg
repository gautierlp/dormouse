<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <g filter="url(#ink)" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- the chat bubble it sleeps on -->
    <path d="M96 352 C96 318 124 300 160 300 L388 300 C424 300 448 318 448 352
             C448 386 424 404 388 404 L210 404 L164 446 L172 404 L160 404
             C124 404 96 386 96 352 Z" fill="#fff" stroke-width="8"/>
    <!-- tail, wrapped round the body -->
    <path d="M372 300 C420 270 426 206 392 166 C366 136 324 128 300 142
             C330 140 362 160 372 196 C384 238 366 276 336 296 Z" fill="#000" stroke-width="6"/>
    <!-- body, curled -->
    <path d="M166 300 C150 244 178 186 236 166 C292 148 350 172 366 226
             C378 266 362 296 340 300 Z" fill="#000" stroke-width="6"/>
    <!-- head, tucked in -->
    <path d="M150 300 C136 268 148 230 182 216 C214 204 252 220 262 252
             C268 272 262 290 252 300 Z" fill="#000" stroke-width="6"/>
    <!-- ear -->
    <path d="M180 222 C164 188 182 160 210 164 C232 168 236 196 222 218 Z" fill="#000" stroke-width="6"/>
    <path d="M194 210 C186 192 196 178 210 180 C220 184 220 198 212 210 Z" fill="#fff" stroke-width="3"/>
    <!-- line between head and body -->
    <path d="M232 214 C256 228 268 256 262 290" fill="none" stroke="#fff" stroke-width="5"/>
    <!-- tail fur -->
    <path d="M378 176 L392 170 M384 208 L400 206 M380 242 L396 248 M366 272 L378 284" fill="none" stroke="#fff" stroke-width="4"/>
    <!-- paws under the chin -->
    <ellipse cx="184" cy="294" rx="9" ry="6" fill="#fff" stroke-width="3"/>
    <ellipse cx="206" cy="296" rx="9" ry="6" fill="#fff" stroke-width="3"/>
    <!-- closed eye -->
    <path d="M186 262 C194 270 206 270 214 262" fill="none" stroke="#fff" stroke-width="5"/>
    <!-- nose -->
    <circle cx="152" cy="284" r="6" fill="#fff" stroke="none"/>
    <!-- z z z -->
    <path d="M268 112 L296 112 L268 140 L296 140" fill="none" stroke-width="7"/>
    <path d="M312 72 L332 72 L312 92 L332 92" fill="none" stroke-width="6"/>
    <path d="M346 40 L360 40 L346 54 L360 54" fill="none" stroke-width="5"/>
  </g>
  <!-- ink spots -->
  <g fill="#000">
    <circle cx="80" cy="140" r="3"/><circle cx="104" cy="112" r="2"/><circle cx="440" cy="460" r="3"/>
    <circle cx="466" cy="440" r="2"/><circle cx="60" cy="300" r="2.5"/><circle cx="470" cy="250" r="2.5"/>
    <circle cx="420" cy="96" r="2"/><circle cx="130" cy="470" r="2"/>
  </g>
</svg>
